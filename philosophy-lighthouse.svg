<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Developer philosophy beside a lighthouse: design with empathy, build with precision, and ship products people enjoy using. Principles: clean, maintainable, user-centric, secure, useful.">
  <defs>
    <clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath>
    <clipPath id="scene"><rect width="330" height="300"/></clipPath>
    <clipPath id="tw"><polygon points="110,252 150,252 142,100 118,100"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050E24"/>
      <stop offset="1" stop-color="#0B4A8F"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7FC4"/>
      <stop offset="1" stop-color="#052447"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FEF9C3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FEF9C3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E0F2FE" stop-opacity="0"/>
    </radialGradient>
    <style>
      text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .quote{font-size:24px;font-weight:600;fill:#F8FAFC;animation:fade 1s ease-out .2s both}
      .quote .hl{fill:#7DD3FC}
      .ttl{font-size:14.5px;font-weight:700;fill:#F1F5F9}
      .dsc{font-size:12.5px;fill:#BAE6FD;opacity:.85}
      .row{animation:rise .6s ease-out both}
      .r1{animation-delay:.5s}.r2{animation-delay:.65s}.r3{animation-delay:.8s}.r4{animation-delay:.95s}.r5{animation-delay:1.1s}
      .tick{fill:none;stroke:#7DD3FC;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .tw{animation:twinkle 3s ease-in-out infinite}
      .sweep{transform-origin:130px 83px;animation:sweep 6s ease-in-out infinite alternate}
      .lamp{animation:lamp 2.4s ease-in-out infinite}
      .wv1{animation:d1 8s linear infinite}
      .wv2{animation:d2 5.5s linear infinite reverse}
      .boat{transform-origin:262px 262px;animation:rock 4s ease-in-out infinite}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
      @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
      @keyframes sweep{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
      @keyframes lamp{0%,100%{opacity:.25}50%{opacity:.9}}
      @keyframes d1{from{transform:translateX(0)}to{transform:translateX(-160px)}}
      @keyframes d2{from{transform:translateX(0)}to{transform:translateX(-120px)}}
      @keyframes rock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#sky)"/>

    <g clip-path="url(#scene)">
      <circle cx="270" cy="54" r="46" fill="url(#moonGlow)"/>
      <circle cx="270" cy="54" r="14" fill="#E0F2FE"/>
      <circle class="tw" cx="40" cy="40" r="1.5" fill="#E0F2FE"/>
      <circle class="tw" cx="90" cy="22" r="1.2" fill="#E0F2FE" style="animation-delay:.7s"/>
      <circle class="tw" cx="200" cy="30" r="1.4" fill="#E0F2FE" style="animation-delay:1.4s"/>
      <circle class="tw" cx="30" cy="120" r="1.2" fill="#E0F2FE" style="animation-delay:2s"/>
      <circle class="tw" cx="300" cy="130" r="1.3" fill="#E0F2FE" style="animation-delay:1s"/>
      <circle class="tw" cx="220" cy="100" r="1.1" fill="#E0F2FE" style="animation-delay:2.4s"/>

      <rect y="252" width="330" height="48" fill="url(#sea)"/>

      <g class="sweep">
        <polygon points="130,83 330,24 330,142" fill="url(#beam)"/>
      </g>

      <path d="M40,300 C50,264 88,248 130,248 C172,248 210,264 224,300 Z" fill="#0D2740"/>
      <path d="M62,268 C80,254 104,250 130,250 C160,250 190,256 206,270 C170,260 110,258 62,268 Z" fill="#1E4468" opacity="0.8"/>
      <polygon points="110,252 150,252 142,100 118,100" fill="#F8FAFC"/>
      <g clip-path="url(#tw)">
        <rect x="100" y="126" width="60" height="20" fill="#F43F5E"/>
        <rect x="100" y="166" width="60" height="20" fill="#F43F5E"/>
        <rect x="100" y="206" width="60" height="20" fill="#F43F5E"/>
      </g>
      <rect x="112" y="94" width="36" height="6" rx="1.5" fill="#334155"/>
      <rect x="118" y="72" width="24" height="22" fill="#FDE68A"/>
      <circle class="lamp" cx="130" cy="83" r="28" fill="#FEF3C7" opacity="0.35"/>
      <polygon points="114,72 146,72 130,54" fill="#334155"/>
      <circle cx="130" cy="50" r="3" fill="#334155"/>

      <path class="wv1" fill="#0B6FB8" opacity="0.85" d="M0,272 q40,-7 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 L640,300 L0,300 Z"/>
      <g class="boat">
        <rect x="264" y="226" width="1.5" height="30" fill="#E2E8F0"/>
        <polygon points="265.5,228 265.5,254 284,254" fill="#F8FAFC"/>
        <polygon points="263.5,234 263.5,254 252,254" fill="#BAE6FD"/>
        <path d="M250,255 L282,255 L277,262 L255,262 Z" fill="#B45309"/>
      </g>
      <path class="wv2" fill="#064A8C" opacity="0.95" d="M0,284 q30,-6 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 L600,300 L0,300 Z"/>
    </g>

    <rect x="330" width="570" height="300" fill="#061A33" fill-opacity="0.62"/>
    <line x1="330" y1="0" x2="330" y2="300" stroke="#BAE6FD" stroke-opacity="0.18"/>

    <text class="quote" x="368" y="62">Design with <tspan class="hl">empathy</tspan>,</text>
    <text class="quote" x="368" y="94">build with <tspan class="hl">precision</tspan>, and ship</text>
    <text class="quote" x="368" y="126">products people <tspan class="hl">enjoy</tspan> using.</text>

    <line x1="368" y1="146" x2="860" y2="146" stroke="#BAE6FD" stroke-opacity="0.18"/>

    <g class="row r1">
      <circle cx="376" cy="170" r="8" fill="#38BDF8" fill-opacity="0.18" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <path class="tick" d="M372.5,170 L375,172.5 L380,167"/>
      <text class="ttl" x="396" y="175">Clean</text>
      <text class="dsc" x="530" y="175">Readable, simple code</text>
    </g>
    <g class="row r2">
      <circle cx="376" cy="196" r="8" fill="#38BDF8" fill-opacity="0.18" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <path class="tick" d="M372.5,196 L375,198.5 L380,193"/>
      <text class="ttl" x="396" y="201">Maintainable</text>
      <text class="dsc" x="530" y="201">Built to evolve</text>
    </g>
    <g class="row r3">
      <circle cx="376" cy="222" r="8" fill="#38BDF8" fill-opacity="0.18" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <path class="tick" d="M372.5,222 L375,224.5 L380,219"/>
      <text class="ttl" x="396" y="227">User-Centric</text>
      <text class="dsc" x="530" y="227">Real needs come first</text>
    </g>
    <g class="row r4">
      <circle cx="376" cy="248" r="8" fill="#38BDF8" fill-opacity="0.18" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <path class="tick" d="M372.5,248 L375,250.5 L380,245"/>
      <text class="ttl" x="396" y="253">Secure</text>
      <text class="dsc" x="530" y="253">Safe by default</text>
    </g>
    <g class="row r5">
      <circle cx="376" cy="274" r="8" fill="#38BDF8" fill-opacity="0.18" stroke="#7DD3FC" stroke-opacity="0.5"/>
      <path class="tick" d="M372.5,274 L375,276.5 L380,271"/>
      <text class="ttl" x="396" y="279">Useful</text>
      <text class="dsc" x="530" y="279">Solves real problems</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="17.5" fill="none" stroke="#BAE6FD" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
