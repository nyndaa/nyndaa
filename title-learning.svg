<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" width="900" height="72" role="img" aria-label="Currently Learning">
  <defs>
    <clipPath id="c"><rect width="900" height="72" rx="18"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.6" stop-color="#0A3D75"/>
      <stop offset="1" stop-color="#0891D1"/>
    </linearGradient>
    <style>
      text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .t{font-size:28px;font-weight:700;fill:#FFFFFF;letter-spacing:.5px;animation:rise .9s ease-out .1s both}
      .n{font-size:44px;font-weight:800;fill:#7DD3FC;opacity:.35}
      .w1{animation:d1 8s linear infinite}
      .w2{animation:d2 5.5s linear infinite reverse}
      .b{opacity:0;animation:up 6s ease-in infinite}
      @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes d1{from{transform:translateX(0)}to{transform:translateX(-150px)}}
      @keyframes d2{from{transform:translateX(0)}to{transform:translateX(-110px)}}
      @keyframes up{0%{transform:translateY(0);opacity:0}20%{opacity:.6}100%{transform:translateY(-34px);opacity:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="72" fill="url(#g)"/>
    <path class="w1" fill="#38BDF8" opacity="0.28" d="M0,56 q37.5,-6 75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 t75,0 L1200,520 L0,520 Z"/>
    <path class="w2" fill="#7DD3FC" opacity="0.22" d="M0,62 q27.5,-5 55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 t55,0 L1100,520 L0,520 Z"/>
    <circle class="b" cx="640" cy="64" r="3" fill="none" stroke="#BAE6FD" stroke-width="1.2"/>
    <circle class="b" cx="720" cy="66" r="2" fill="none" stroke="#BAE6FD" stroke-width="1.2" style="animation-delay:2s"/>
    <circle class="b" cx="780" cy="64" r="3.5" fill="none" stroke="#BAE6FD" stroke-width="1.2" style="animation-delay:4s"/>
  </g>
  <rect x="22" y="20" width="5" height="32" rx="2.5" fill="#7DD3FC"/>
  <text class="t" x="42" y="46">Currently Learning</text>
  <text class="n" x="872" y="52" text-anchor="end">04</text>
</svg>
