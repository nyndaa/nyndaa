<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Current Focus and Continuous Learning: PHP and Laravel Architecture, REST API Development, Database Optimization, Modern JavaScript, UI/UX Design Systems, Clean Code, AI Integration" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a4f8f"/>
      <stop offset="0.35" stop-color="#06306a"/>
      <stop offset="1" stop-color="#020b1f"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bff4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd0ff"/>
      <stop offset="1" stop-color="#1c7fd1"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset="1" stop-color="#a9dcf3"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1596d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b4f9c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d6fb8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#04265a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7be7ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7be7ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="900" height="340" rx="22"/></clipPath>
  </defs>

  <style>
    .title { font: 700 19px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9eeaff; }
    .pill-t { font: 600 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #eafaff; text-anchor: middle; }
    .pill { fill: #0d4a86; fill-opacity: 0.45; stroke: #5fd6ff; stroke-opacity: 0.55; stroke-width: 1.2; }
    .b { fill: none; stroke: #bff4ff; stroke-opacity: 0.55; stroke-width: 1.3; animation: rise 9s linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-300px); opacity: 0; } }
    .w1 { animation: drift 14s linear infinite; }
    .w2 { animation: drift 9s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-900px); } }
    .whale { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translate(170px,20px) scale(0.8); } 50% { transform: translate(170px,10px) scale(0.8); } }
    .fish { animation: swim 11s ease-in-out infinite alternate; }
    @keyframes swim { from { transform: translateX(0); } to { transform: translateX(60px); } }
    .ray { animation: sway 8s ease-in-out infinite alternate; transform-origin: 450px 0; }
    @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="340" fill="url(#sea)"/>

    <!-- sinar cahaya dari permukaan -->
    <g class="ray">
      <polygon points="120,0 190,0 330,340 150,340" fill="url(#ray)" opacity="0.5"/>
      <polygon points="400,0 440,0 560,340 430,340" fill="url(#ray)" opacity="0.4"/>
      <polygon points="700,0 760,0 900,340 740,340" fill="url(#ray)" opacity="0.45"/>
    </g>

    <!-- cahaya lembut -->
    <ellipse cx="780" cy="40" rx="190" ry="120" fill="url(#glow)"/>

    <!-- gelembung -->
    <g>
      <circle class="b" cx="60" cy="320" r="5" style="animation-delay:0s"/>
      <circle class="b" cx="210" cy="330" r="3.5" style="animation-delay:2.2s"/>
      <circle class="b" cx="330" cy="325" r="6" style="animation-delay:4.5s"/>
      <circle class="b" cx="520" cy="335" r="4" style="animation-delay:1.3s"/>
      <circle class="b" cx="640" cy="322" r="3" style="animation-delay:6s"/>
      <circle class="b" cx="860" cy="330" r="5" style="animation-delay:3.4s"/>
      <circle class="b" cx="740" cy="338" r="3" style="animation-delay:7.2s"/>
    </g>

    <!-- paus -->
    <g class="whale" transform="translate(170,20) scale(0.8)">
      <path d="M862 188 C890 190 902 160 894 130 C882 150 868 152 852 160 Z" fill="#2a8fdc"/>
      <path d="M852 176 C880 196 884 226 868 244 C864 224 852 214 840 206 Z" fill="#2a8fdc"/>
      <path d="M640 190 C640 130 720 108 790 123 C850 136 882 170 872 200 C862 232 800 247 730 242 C680 238 640 226 640 190 Z" fill="url(#whale)"/>
      <path d="M646 204 C690 216 760 224 850 214 C838 236 790 248 730 243 C684 239 652 228 646 204 Z" fill="url(#belly)"/>
      <path d="M742 218 C737 238 762 252 778 247 C767 237 763 228 763 218 Z" fill="#1c6fc0"/>
      <circle cx="690" cy="172" r="4" fill="#06223f"/>
      <ellipse cx="706" cy="190" rx="10" ry="5" fill="#ff9db0" opacity="0.55"/>
      <path d="M700 134 C706 118 712 112 706 98 M716 130 C722 116 730 112 726 98" fill="none" stroke="#bff4ff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ikan kecil -->
    <g class="fish" opacity="0.85">
      <g transform="translate(470,262)">
        <ellipse cx="0" cy="0" rx="12" ry="6" fill="#ffd36e"/>
        <path d="M-10 0 L-22 -7 L-22 7 Z" fill="#ffb347"/>
        <circle cx="6" cy="-1.5" r="1.4" fill="#06223f"/>
      </g>
      <g transform="translate(520,276) scale(0.75)">
        <ellipse cx="0" cy="0" rx="12" ry="6" fill="#8ff0c4"/>
        <path d="M-10 0 L-22 -7 L-22 7 Z" fill="#4fd1a1"/>
        <circle cx="6" cy="-1.5" r="1.4" fill="#06223f"/>
      </g>
    </g>

    <!-- konten -->
    <text class="title" x="48" y="92">Current Focus &amp; Continuous Learning</text>
    <path d="M48 104 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#5fd6ff" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>

    <g>
      <rect class="pill" x="48"  y="128" width="226" height="36" rx="18"/><text class="pill-t" x="161" y="151">PHP &amp; Laravel Architecture</text>
      <rect class="pill" x="288" y="128" width="180" height="36" rx="18"/><text class="pill-t" x="378" y="151">REST API Development</text>
      <rect class="pill" x="482" y="128" width="188" height="36" rx="18"/><text class="pill-t" x="576" y="151">Database Optimization</text>

      <rect class="pill" x="48"  y="178" width="159" height="36" rx="18"/><text class="pill-t" x="127.5" y="201">Modern JavaScript</text>
      <rect class="pill" x="221" y="178" width="180" height="36" rx="18"/><text class="pill-t" x="311" y="201">UI/UX Design Systems</text>
      <rect class="pill" x="415" y="178" width="108" height="36" rx="18"/><text class="pill-t" x="469" y="201">Clean Code</text>
      <rect class="pill" x="537" y="178" width="137" height="36" rx="18"/><text class="pill-t" x="605.5" y="201">AI Integration</text>
    </g>

    <!-- ombak -->
    <g class="w1">
      <path d="M0 292 C150 262 300 322 450 292 C600 262 750 322 900 292 C1050 262 1200 322 1350 292 C1500 262 1650 322 1800 292 V340 H0 Z" fill="url(#wave1)"/>
    </g>
    <g class="w2">
      <path d="M0 308 C150 284 300 332 450 308 C600 284 750 332 900 308 C1050 284 1200 332 1350 308 C1500 284 1650 332 1800 308 V340 H0 Z" fill="url(#wave2)"/>
    </g>
  </g>
</svg>
