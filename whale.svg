<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="380" height="260" role="img" aria-label="Animated friendly whale spouting water on a moonlit sea">
  <defs>
    <clipPath id="card"><rect width="380" height="260" rx="28"/></clipPath>
    <clipPath id="body"><path d="M30,140 C30,95 100,70 175,78 C240,84 285,110 300,140 C312,165 290,190 240,198 C170,208 85,205 52,180 C38,170 30,156 30,140 Z"/></clipPath>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050E24"/>
      <stop offset="1" stop-color="#0B5FA5"/>
    </linearGradient>
    <linearGradient id="whaleBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CC4F5"/>
      <stop offset="1" stop-color="#2B7FC9"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E0F2FE" stop-opacity="0"/>
    </radialGradient>
    <style>
      .whale{transform-origin:170px 150px;animation:swim 6s ease-in-out infinite}
      .tail{transform-origin:290px 138px;animation:flap 3s ease-in-out infinite}
      .jet{stroke-dasharray:100;stroke-dashoffset:100;animation:spout 4s ease-in-out infinite}
      .drop{opacity:0;animation:drop 4s ease-in infinite}
      .waveA{animation:dA 7s linear infinite}
      .waveB{animation:dB 5s linear infinite reverse}
      .tw{animation:twinkle 3s ease-in-out infinite}
      .sp{transform-box:fill-box;transform-origin:center;animation:spark 3s ease-in-out infinite}
      @keyframes swim{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
      @keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-9deg)}}
      @keyframes spout{0%{stroke-dashoffset:100}30%{stroke-dashoffset:0}60%{stroke-dashoffset:-100}100%{stroke-dashoffset:-100}}
      @keyframes drop{0%,30%{opacity:0;transform:translateY(0)}40%{opacity:1;transform:translateY(0)}70%{opacity:0;transform:translateY(22px)}100%{opacity:0}}
      @keyframes dA{from{transform:translateX(0)}to{transform:translateX(-120px)}}
      @keyframes dB{from{transform:translateX(0)}to{transform:translateX(-160px)}}
      @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
      @keyframes spark{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1);opacity:1}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="380" height="260" fill="url(#night)"/>
    <circle cx="326" cy="48" r="46" fill="url(#moonGlow)"/>
    <circle cx="326" cy="48" r="14" fill="#E0F2FE"/>
    <circle cx="321" cy="44" r="3" fill="#BAE6FD" opacity="0.7"/>
    <circle class="tw" cx="40" cy="36" r="1.5" fill="#E0F2FE"/>
    <circle class="tw" cx="92" cy="22" r="1.2" fill="#E0F2FE" style="animation-delay:.8s"/>
    <circle class="tw" cx="210" cy="30" r="1.5" fill="#E0F2FE" style="animation-delay:1.6s"/>
    <circle class="tw" cx="262" cy="58" r="1.1" fill="#E0F2FE" style="animation-delay:2.2s"/>
    <circle class="tw" cx="24" cy="86" r="1.2" fill="#E0F2FE" style="animation-delay:1.1s"/>

    <g class="whale">
      <g class="tail">
        <path d="M284,126 C308,124 324,106 326,82 C334,92 348,94 362,86 C360,112 342,136 308,148 C296,152 284,148 284,126 Z" fill="#2B7FC9"/>
      </g>
      <path d="M30,140 C30,95 100,70 175,78 C240,84 285,110 300,140 C312,165 290,190 240,198 C170,208 85,205 52,180 C38,170 30,156 30,140 Z" fill="url(#whaleBody)"/>
      <g clip-path="url(#body)">
        <ellipse cx="170" cy="212" rx="150" ry="44" fill="#E0F2FE"/>
        <path d="M60,176 C100,192 150,198 200,198" fill="none" stroke="#9CCBEF" stroke-width="1.6"/>
        <path d="M78,168 C115,184 160,190 215,190" fill="none" stroke="#9CCBEF" stroke-width="1.6"/>
      </g>
      <path d="M150,168 C158,194 182,206 206,200 C192,190 178,178 150,168 Z" fill="#1F6DB5"/>
      <circle cx="86" cy="128" r="4.5" fill="#052B52"/>
      <circle cx="87.5" cy="126.5" r="1.5" fill="#FFFFFF"/>
      <ellipse cx="98" cy="142" rx="9" ry="4.5" fill="#FDA4AF" opacity="0.55"/>
      <path d="M42,152 C62,168 94,168 116,158" fill="none" stroke="#052B52" stroke-width="2.5" stroke-linecap="round"/>

      <path class="jet" pathLength="100" d="M120,86 C120,66 112,52 98,48" fill="none" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round"/>
      <path class="jet" pathLength="100" d="M120,86 C120,66 128,52 142,48" fill="none" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round"/>
      <circle class="drop" cx="96" cy="52" r="2.5" fill="#BAE6FD"/>
      <circle class="drop" cx="144" cy="52" r="2.5" fill="#BAE6FD" style="animation-delay:.15s"/>
    </g>

    <path class="waveA" fill="#0E7FC4" opacity="0.92" d="M0,198 q30,-7 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 L600,520 L0,520 Z"/>
    <path class="waveB" fill="#0A5A9C" opacity="0.96" d="M0,214 q40,-8 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 L640,520 L0,520 Z"/>

    <g transform="translate(330,150)"><path class="sp" d="M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z" fill="#E0F2FE"/></g>
    <g transform="translate(58,62)"><path class="sp" style="animation-delay:1s" d="M0,-6 L1.7,-1.7 L6,0 L1.7,1.7 L0,6 L-1.7,1.7 L-6,0 L-1.7,-1.7 Z" fill="#E0F2FE"/></g>
    <g transform="translate(250,112)"><path class="sp" style="animation-delay:2s" d="M0,-5 L1.5,-1.5 L5,0 L1.5,1.5 L0,5 L-1.5,1.5 L-5,0 L-1.5,-1.5 Z" fill="#E0F2FE"/></g>
  </g>
</svg>
