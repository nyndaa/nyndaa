name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#4fc3f7&color_dots=#0f1a2b,#0e4a7a,#1b78c2,#3fa9f5,#7fdcff

      - uses: crazy-max/github-pages-deploy-action@v4
        with:
          target_branch: output
          build_dir: dist
