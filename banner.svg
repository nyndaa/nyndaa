<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Raharjian (Nadia) - Informatics Student, Full-Stack Developer, UI/UX Designer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#0A3D75"/>
      <stop offset="100%" stop-color="#0891D1"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9BE3FF"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .eyebrow { font-size: 15px; letter-spacing: 6px; fill: #7DD3FC; opacity: 0; animation: rise 1s ease-out 0.2s forwards; }
      .title { font-size: 62px; font-weight: 700; fill: url(#title); opacity: 0; animation: rise 1s ease-out 0.5s forwards; }
      .sub { font-size: 21px; letter-spacing: 1.5px; fill: #E0F2FE; opacity: 0; animation: rise 1s ease-out 0.9s forwards; }
      .line { stroke: #38BDF8; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1.2s ease-out 1.2s forwards; }
      .wave1 { animation: drift 14s linear infinite; }
      .wave2 { animation: drift 9s linear infinite reverse; }
      .orb { fill: #BAE6FD; opacity: 0.25; animation: float 6s ease-in-out infinite; }
      .orb:nth-of-type(2) { animation-duration: 8s; animation-delay: -2s; }
      .orb:nth-of-type(3) { animation-duration: 7s; animation-delay: -4s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <circle class="orb" cx="980" cy="70" r="26"/>
  <circle class="orb" cx="1090" cy="130" r="14"/>
  <circle class="orb" cx="880" cy="120" r="9"/>

  <g>
    <text class="eyebrow" x="80" y="92">PORTFOLIO &#183; WEB &amp; DESIGN</text>
    <text class="title" x="78" y="160">Raharjian (Nadia)</text>
    <text class="sub" x="80" y="202">Informatics Student  &#183;  Full-Stack Developer  &#183;  UI/UX Designer</text>
    <line class="line" x1="80" y1="224" x2="200" y2="224"/>
  </g>

  <g class="wave1" opacity="0.35">
    <path fill="#38BDF8" d="M0,235 C150,205 350,265 600,235 C850,205 1050,265 1200,235 C1350,205 1550,265 1800,235 C2050,205 2250,265 2400,235 L2400,300 L0,300 Z"/>
  </g>
  <g class="wave2" opacity="0.55">
    <path fill="#0EA5E9" d="M0,255 C150,235 350,280 600,255 C850,230 1050,280 1200,255 C1350,235 1550,280 1800,255 C2050,230 2250,280 2400,255 L2400,300 L0,300 Z"/>
  </g>
  <g class="wave1" opacity="0.9" style="animation-duration: 18s">
    <path fill="#071426" d="M0,275 C150,260 350,292 600,275 C850,258 1050,292 1200,275 C1350,260 1550,292 1800,275 C2050,258 2250,292 2400,275 L2400,300 L0,300 Z"/>
  </g>
</svg>
