<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="900" height="56" role="img" aria-label="Developer Philosophy">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="900" height="56" fill="url(#fade)"/></mask>
    <style>
      text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .t{font-size:26px;font-weight:700;fill:url(#t);letter-spacing:.3px;animation:rise .8s ease-out .1s both}
      .w{animation:drift 6s linear infinite}
      @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>
  <text class="t" x="2" y="32">Developer Philosophy</text>
  <g mask="url(#m)">
    <path class="w" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" opacity="1" d="M0,47 q30,-5 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>
  </g>
</svg>
